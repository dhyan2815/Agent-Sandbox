name: Daily Profile Quote Update

on:
  schedule:
    # 9:00 PM IST corresponds to 15:30 UTC
    - cron: '30 15 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  update-quote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Requires a Personal Access Token to push to a different repository (dhyan2815/dhyan2815)
          token: ${{ secrets.GH_PAT || github.token }}
          submodules: true

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run Quote Update Script
        shell: pwsh
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          ./scripts/update-profile-quote.ps1 -RepoPath "./dhyan2815" -Force