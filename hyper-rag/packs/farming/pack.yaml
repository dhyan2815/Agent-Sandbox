# Indian farming schemes and practices.
# Source: English Wikipedia articles (text licensed CC BY-SA 4.0), fetched from their
# public /wiki/ pages, which robots.txt allows. Nothing downloaded is committed.
#
# Why not government portals: pmkisan.gov.in did not respond to automated requests, and
# pmfby.gov.in and vikaspedia.in serve their content through JavaScript, which this
# plain-HTTP ingester does not execute. Adding them needs a browser-based fetcher.
name: farming
description: Indian agriculture - government schemes for farmers (PM-KISAN, crop insurance, Kisan Credit Card, minimum support price, e-NAM, soil health cards, irrigation) and farming practices and crop seasons in India.
